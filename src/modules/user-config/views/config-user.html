        <!-- Menú de usuario -->

    <h2 class="titulo">Configuración del Usuario</h2>

    <!-- Contenido principal de la página -->
    <div class="wrapper">

        <div class="container">

        <div id="text_message" class="error-message" style="display: none;"></div>
        <h1>Configuración</h1>   
        
        <!--PARA MODIFICAR, MENSAJES DE ERROR POR DEFECTO DE LA VISTA LOGIN-->
        <div id="error-message" class="error-message" style="display:none;">
            <strong>Error:</strong> Usuario o contraseña incorrectos.
        </div>
        
        <form action="#" method="POST">
            
            <label for="user">Usuario</label>
            <input type="text" id="user" name="user" autocomplete="off">

            <label for="password">Contraseña</label>
            <div style="position: relative; display: flex; align-items: center;">
                <input type="password" id="password" name="password" style="flex: 1;">
                <button type="button" id="togglePassword" style="margin-left: 10px; padding: 8px 12px; cursor: pointer;">
                    👁️
                </button>
            </div>

            <input class="btn-primary" type="submit" id="enviar" value="Guardar cambios">
            <input class="btn-primary" type="reset" value="Deshacer cambios">
            <input class="btn-primary" type="submit" id="eliminar" value="Eliminar usuario">
        </form>
        </div>
    </div>

    <script src="../../../global/services/check-guest.js"></script>
