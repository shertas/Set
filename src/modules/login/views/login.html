<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROYECTO SET</title>
    <link rel="icon" type="image/png" href="/assets/img/Set favicon.png">
    <link rel="stylesheet" href="../../../global/styles/styles.css">
</head>

<body class="body-main">
    <header class="auth-header">PROYECTO SET</header>

    <div class="img-login">
        <img src="/assets/img/Logo set.png" height="200" width="300" alt="Logo Juego Set">
    </div>

    <!-- Contenido principal de la página -->
    <div class="login-wrapper">

        <div class="login-container">

            <h1 id="form-title">Iniciar Sesión</h1>

            <div id="error-message" class="error-message" style="display:none;">
                <strong>Error:</strong> Usuario o contraseña incorrectos.
            </div>

            <div id="success-message" class="success-message" style="display:none;">
                <strong>Éxito:</strong> Usuario creado correctamente. Ahora puedes iniciar sesión.
            </div>

            <!-- Formulario de Login -->
            <form id="login-form" action="../../../../index.php" method="POST">

                <label for="user">Usuario</label>
                <input type="text" id="user" name="user" autocomplete="off">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password">

                <button type="submit">Entrar</button>

                <a href="../services/guest-login.php" class="btn-secondary guest-link">Entrar como invitado</a>

            </form>

            <!-- Formulario de Registro -->
            <form id="register-form" action="../services/register.php" method="POST" style="display:none;">

                <div id="register-error-message" class="error-message" style="display:none;"></div>

                <label for="new-user">Usuario</label>
                <input type="text" id="new-user" name="new-user" autocomplete="off">

                <label for="new-password">Contraseña</label>
                <input type="password" id="new-password" name="new-password">

                <label for="confirm-password">Confirmar Contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password">

                <button type="submit">Crear Usuario</button>

            </form>

            <!-- Botón para alternar entre login y registro -->
            <div class="toggle-form">
                <p id="toggle-text">¿No tienes cuenta? <a href="#" id="toggle-link">Crear una nueva</a></p>
            </div>

        </div>

    </div>

    <script src="../services/login.js"></script>
</body>
</html>
