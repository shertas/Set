<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROYECTO SET</title>
    <link rel="stylesheet" href="../../../global/styles/styles.css">
    <script src="../services/login.js"></script>
</head>

<body>
    <header class="auth-header">PROYECTO SET</header>

    <div class="login-wrapper">

        <div class="login-container">
            <!-- Contenido principal de la página -->
            <h1>Iniciar Sesión</h1>

            <div id="error-message" class="error-message" style="display:none;">
                <strong>Error:</strong> Usuario o contraseña incorrectos.
            </div>

            <form action="../../../../public/index.php" method="POST">

                <label for="user">Usuario</label>
                <input type="text" id="user" name="user" autocomplete="off">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password">

                <button type="submit">Entrar</button>

                <a href="welcome.html" class="btn-secondary invitado-link">Entrar como invitado</a>

            </form>    
        </div>

    </div>
</body>

</html>
