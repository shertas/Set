<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROYECTO SET</title>
    <link rel="icon" type="image/png" href="/public/assets/img/Set favicon.png">
    <link rel="stylesheet" href="../../../global/styles/styles.css">
</head>

<body class="body-main">
    <header class="auth-header">PROYECTO SET</header>

    <div class="img-login">
        <img src="/public/assets/img/Logo set.png" height="200" width="300" alt="Logo Juego Set">
    </div>


    <!-- Contenido principal de la página -->
    <div class="login-wrapper">

        <div class="login-container">
            
            <h1>Iniciar Sesión</h1>

            <div id="error-message" class="error-message" style="display:none;">
                <strong>Error:</strong> Usuario o contraseña incorrectos.
            </div>

            <form action="../../../../public/index.php" method="POST">

                <label for="user">Usuario</label>
                <input type="text" id="user" name="user" autocomplete="off">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password">

                <button type="submit">Entrar</button>

                <a href="welcome.html" class="btn-secondary invitado-link">Entrar como invitado</a>

            </form>    
        </div>

    </div>

    <script src="../services/login.js"></script>
    
</body>
</html>
